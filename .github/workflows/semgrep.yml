name: Semgrep

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'  # Run once a week on Sunday at midnight

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v3
      
      - name: Semgrep Scan
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/nodejs
            p/express
            p/mongodb
            p/owasp-top-ten
            p/security-audit
          # Set the SEMGREP_APP_TOKEN in your repository secrets to enable Semgrep Cloud Platform
          # SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
