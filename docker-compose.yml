version: '3.8'

services:
  app:
    build: .
    container_name: crud-app
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      - NODE_ENV=development
      - PORT=9999
      - MONGODB_URI=mongodb://mongodb:27017/crud-app
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
